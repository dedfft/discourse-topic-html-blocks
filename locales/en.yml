en:
  theme_metadata:
    description: "Render custom HTML (e.g. iframes) below the first post on specified topics. Group topics under named blocks (e.g. 'Italy', 'Career Coaching') and reuse the same HTML across many topics. Optional per-locale overrides let you show different HTML to viewers in different languages."
  theme_settings:
    enable_remote: "Fetch block content live from a CMS at page load. When a block's html contains a [data-papers-src=\"URL\"] marker, that element is filled from the URL (with the marker's inner html as the offline fallback). Turn off to render every block's static html only (legacy behaviour)."
    remote_base_url: "Base URL of the CMS that serves dynamic blocks (default https://papers.eliteskillset.com). Used only for the optional lead-form iframe; the community/strip blocks carry their own full URL in the data-papers-src marker."
    blocks: "Named HTML blocks injected on post #1. Each block: name (label); html (markup - paste a <div data-papers-src=\"https://papers.eliteskillset.com/api/forum-blocks/community-promo?lang=ru\"> marker to pull content live, keeping any inner html as the offline fallback); position (bottom = below the first post body, top = a strip above it; default bottom); topic_ids (comma-separated topic IDs, e.g. 123,456); all_topics (check to render on EVERY topic forum-wide instead of listing IDs); category_ids (optional category picker - when all_topics is on, limit it to these categories only); exclude_topic_ids (optional - never show on these topics); locale_overrides (optional per-language html). A block with matching topic_ids always overrides an all_topics block on the same topic."
