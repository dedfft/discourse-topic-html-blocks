en:
  theme_metadata:
    description: "Render custom HTML (e.g. iframes) on the first post of specified topics — below the body (blocks) or as a strip above it (top_blocks). Pulls content live from a CMS via [data-papers-src] markers, with per-locale overrides and a compact mode on short posts."
  theme_settings:
    enable_remote: "Fetch block content live from a CMS at page load. When a block's html contains a [data-papers-src=\"URL\"] (or [data-papers-src-base=\"URL\"]) marker, that element is filled from the URL (with the marker's inner html as the offline fallback). Turn off to render every block's static html only."
    remote_base_url: "Base URL of the CMS that serves dynamic blocks (default https://papers.eliteskillset.com). Used for the optional lead-form iframe; the community/strip markers carry their own URL."
    compact_max_chars: "Short-post threshold. When the first post's text is shorter than this many characters, the card collapses the sections the CMS marked 'hide on short posts' (e.g. profession chats + support). Set 0 to disable compact mode. Default 600."
    blocks: "HTML blocks injected at the BOTTOM of post #1 (below the body). Each block: name (label); html (paste a marker like <div data-papers-src=\"https://papers.eliteskillset.com/api/forum-blocks/community-promo?lang=ru\"> — or <div data-papers-src-base=\"https://papers.eliteskillset.com/api/forum-blocks/community-promo\"> to auto-append the viewer's ?lang= — keeping any inner html as the offline fallback); topic_ids (comma-separated, e.g. 123,456); all_topics (render on EVERY topic); category_ids (limit an all_topics block to these categories); exclude_topic_ids (never show on these); locale_overrides (optional per-language html). A topic_ids block overrides an all_topics block in the same slot."
    top_blocks: "HTML blocks injected at the TOP of post #1 (a strip above the body) — e.g. the verified PR-manager strip. Same fields as 'blocks' (no position needed; this list is always top). Paste <div data-papers-src=\"https://papers.eliteskillset.com/api/forum-blocks/pr-manager-strip?lang=ru\">."
