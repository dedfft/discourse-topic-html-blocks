en:
  theme_metadata:
    description: "Render custom HTML (e.g. iframes) below the first post on specified topics. Group topics under named blocks (e.g. 'Italy', 'Career Coaching') and reuse the same HTML across many topics. Optional per-locale overrides let you show different HTML to viewers in different languages."
  theme_settings:
    blocks: "Named HTML blocks injected after post #1. Each block: name (label); html (markup, typically an iframe); topic_ids (comma-separated topic IDs, e.g. 123,456); all_topics (check to render on EVERY topic forum-wide instead of listing IDs); category_ids (optional category picker - when all_topics is on, limit it to these categories only); exclude_topic_ids (optional - never show on these topics); locale_overrides (optional per-language html). A block with matching topic_ids always overrides an all_topics block on the same topic."
