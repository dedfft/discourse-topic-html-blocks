en:
  theme_metadata:
    description: "Zero-config promo blocks. Set remote_base_url and the component automatically fetches every block from the CMS (papers.eliteskillset.com) and renders each on the first post at the slot the CMS reports — a strip above the article, the community card below it, and an optional embedded form. Content, language, on/off, and placement are all controlled from the CMS; nothing to paste or configure per topic."
  theme_settings:
    enable_remote: "Master on/off. When on (default), every topic's first post automatically pulls and renders the blocks from the CMS. Turn off to disable the component entirely."
    remote_base_url: "Base URL of the CMS (default https://papers.eliteskillset.com). The component fetches {base}/api/forum-blocks?lang=<locale> and renders what it returns. This is the only thing you normally set."
    compact_max_chars: "Short-post threshold. When the first post's text is shorter than this many characters, the card collapses the sections the CMS marked 'hide on short posts' (e.g. profession chats + support). Set 0 to disable compact mode. Default 600."
