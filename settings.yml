blocks:
  type: objects
  default: []
  schema:
    name: block
    identifier: name
    properties:
      name:
        type: string
        required: true
        validations:
          min_length: 1
      topic_ids:
        type: string
        required: true
      html:
        type: string
        required: true
      locale_overrides:
        type: objects
        schema:
          name: locale_override
          identifier: locale
          properties:
            locale:
              type: string
              required: true
              validations:
                min_length: 2
            html:
              type: string
              required: true
