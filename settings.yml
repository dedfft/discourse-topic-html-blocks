blocks:
  type: objects
  default: []
  schema:
    name: block
    identifier: name
    properties:
      name:
        type: string
        required: true
        validations:
          min_length: 1
      topic_ids:
        type: string
      all_topics:
        type: boolean
      category_ids:
        type: categories
      exclude_topic_ids:
        type: string
      html:
        type: string
        required: true
      locale_overrides:
        type: objects
        schema:
          name: locale_override
          identifier: locale
          properties:
            locale:
              type: string
            html:
              type: string
